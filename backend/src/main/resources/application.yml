spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://mysql:3306/zhuatech_librarydesk?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowLoadLocalInfile=false&sslMode=REQUIRED}
    username: ${DATABASE_USER:librarydesk}
    password: ${DATABASE_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: [classpath:db/migration]
  mvc:
    problemdetails:
      enabled: true
server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        name: LIBRARYDESK_SESSION
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
librarydesk:
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD}
# Hibernate 的连接描述可能包含驱动展开的连接参数；不得输出凭证或业务约束原值。
logging:
  level:
    org.hibernate.orm.connections.pooling: WARN
    org.hibernate.orm.jdbc.error: OFF
